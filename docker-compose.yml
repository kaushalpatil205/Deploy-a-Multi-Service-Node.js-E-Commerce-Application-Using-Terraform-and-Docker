version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: ecommerce-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-net

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    image: ecommerce-user-service:latest
    container_name: user-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce_users
      - JWT_SECRET=supersecretjwtkey123
    depends_on:
      - mongodb
    networks:
      - ecommerce-net

  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    image: ecommerce-product-service:latest
    container_name: product-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce_products
    depends_on:
      - mongodb
    networks:
      - ecommerce-net

  cart-service:
    build:
      context: ./backend/cart-service
      dockerfile: Dockerfile
    image: ecommerce-cart-service:latest
    container_name: cart-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce_carts
    depends_on:
      - mongodb
    networks:
      - ecommerce-net

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    image: ecommerce-order-service:latest
    container_name: order-service
    restart: always
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce_orders
    depends_on:
      - mongodb
    networks:
      - ecommerce-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecommerce-frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
      - "8080:80"
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  mongodb_data:
