server {
    listen 80;
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Microservices API proxy
    location /api/users/ {
        proxy_pass http://user-service:3001/api/users/;
        proxy_set_header Host $host;
    }

    location /api/products/ {
        proxy_pass http://product-service:3002/api/products/;
        proxy_set_header Host $host;
    }

    location /api/cart/ {
        proxy_pass http://cart-service:3003/api/cart/;
        proxy_set_header Host $host;
    }

    location /api/orders/ {
        proxy_pass http://order-service:3004/api/orders/;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
